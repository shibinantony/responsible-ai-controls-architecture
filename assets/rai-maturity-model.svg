<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHeader3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F6E56"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="360" fill="#F8FAFC" rx="16"/>
  <rect x="40" y="25" width="880" height="50" rx="8" fill="url(#gradHeader3)"/>
  <text x="60" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Responsible AI Controls Maturity Curve</text>
  <text x="890" y="56" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E1F5EE">From Passive Intent to Autonomous Enforceability</text>

  <!-- 4 Columns -->
  <!-- Level 1 -->
  <g filter="url(#shadow3)">
    <rect x="40" y="95" width="205" height="235" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="40" y="95" width="205" height="35" rx="10" fill="#64748B"/>
    <text x="142" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">LEVEL 1: ETHICS CHARTERS</text>
    <g transform="translate(55, 145)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">
      <text y="15" font-weight="bold" fill="#475569">POSTURE: PASSIVE</text>
      <text y="40">• High-level principles</text>
      <text y="60">• Ethics board reviews</text>
      <text y="80">• Static policy PDFs</text>
      <text y="100">• No runtime blocking</text>
      <text y="130" font-weight="bold" fill="#EF4444">Bottleneck: Unenforceable</text>
    </g>
  </g>

  <!-- Level 2 -->
  <g filter="url(#shadow3)">
    <rect x="265" y="95" width="205" height="235" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="265" y="95" width="205" height="35" rx="10" fill="#0284C7"/>
    <text x="367" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">LEVEL 2: PRE-LAUNCH GATES</text>
    <g transform="translate(280, 145)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">
      <text y="15" font-weight="bold" fill="#0284C7">POSTURE: COMPLIANCE</text>
      <text y="40">• Pre-deployment checks</text>
      <text y="60">• Manual risk sign-offs</text>
      <text y="80">• Checklist approvals</text>
      <text y="100">• Spreadsheet audit logs</text>
      <text y="130" font-weight="bold" fill="#F59E0B">Bottleneck: Slow Release SLA</text>
    </g>
  </g>

  <!-- Level 3 -->
  <g filter="url(#shadow3)">
    <rect x="490" y="95" width="205" height="235" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="490" y="95" width="205" height="35" rx="10" fill="#0F6E56"/>
    <text x="592" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">LEVEL 3: RUNTIME CONTROLS</text>
    <g transform="translate(505, 145)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">
      <text y="15" font-weight="bold" fill="#0F6E56">POSTURE: ARCHITECTED</text>
      <text y="40">• Input/output guardrails</text>
      <text y="60">• Decision boundaries</text>
      <text y="80">• Automated HITL triggers</text>
      <text y="100">• Cryptographic evidence</text>
      <text y="130" font-weight="bold" fill="#10B981">Milestone: Governed-by-Design</text>
    </g>
  </g>

  <!-- Level 4 -->
  <g filter="url(#shadow3)">
    <rect x="715" y="95" width="205" height="235" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="715" y="95" width="205" height="35" rx="10" fill="#7C3AED"/>
    <text x="817" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">LEVEL 4: DAY 2 AUTONOMY</text>
    <g transform="translate(730, 145)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">
      <text y="15" font-weight="bold" fill="#7C3AED">POSTURE: RESILIENT</text>
      <text y="40">• Continuous drift alerts</text>
      <text y="60">• Bypass telemetry triage</text>
      <text y="80">• Foundation model regression</text>
      <text y="100">• Automated audit replay</text>
      <text y="130" font-weight="bold" fill="#8B5CF6">Standard: Enterprise Scale</text>
    </g>
  </g>
</svg>
